# Bei jeder Änderung auf "main" und automatisch alle 30 Minuten:
# Daten prüfen → aktuelle News/Spiele aus Supabase holen → alle Seiten bauen → auf GitHub Pages veröffentlichen
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      alle_melden:
        description: 'Alle Seiten per IndexNow an Bing & Co. melden'
        type: boolean
        default: false
  schedule:
    - cron: '7,37 * * * *'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Datendateien prüfen
        run: node scripts/validate.mjs
      - name: Seiten bauen (News, Spielplan, Werkzeuge, Sitemap)
        run: node scripts/build.mjs
        env:
          INDEXNOW_ALL: ${{ inputs.alle_melden }}
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: indexnow-urls.json
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  melden:
    needs: veroeffentlichen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: indexnow
        continue-on-error: true
      - name: Neue Seiten per IndexNow an Bing & Co. melden
        run: node scripts/indexnow.mjs indexnow-urls.json
