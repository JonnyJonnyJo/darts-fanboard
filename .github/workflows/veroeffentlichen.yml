# Bei jeder Änderung auf "main" und automatisch alle 30 Minuten:
# Daten prüfen → aktuelle News/Spiele aus Supabase holen → alle Seiten bauen → auf GitHub Pages veröffentlichen
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Datendateien prüfen
        run: node scripts/validate.mjs

      - name: Seiten bauen (News, Spielplan, Werkzeuge, Sitemap)
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
