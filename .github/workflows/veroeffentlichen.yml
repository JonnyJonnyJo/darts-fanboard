# Bei jeder Änderung auf "main": Daten prüfen → Seite auf GitHub Pages veröffentlichen
# (Paarungen & Ergebnisse holt sich die Supabase-Datenbank alle 10 Minuten selbst aus data/matches.json.)
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Datendateien prüfen
        run: node scripts/validate.mjs

      - name: Nur die Webseiten-Dateien einpacken
        run: |
          mkdir _site
          cp -r index.html admin.html impressum.html datenschutz.html teilnahmebedingungen.html \
                config.js tippspiel.js news.js data _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
